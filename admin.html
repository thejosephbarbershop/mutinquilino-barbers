<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - SaaS Barberías</title>
    <style>
        :root { --primary: #d4af37; --bg: #121212; --surface: #1e1e1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; }
        
        aside { width: 250px; background: var(--surface); height: 100vh; padding: 20px; box-sizing: border-box; }
        aside h2 { color: var(--primary); font-size: 1.2rem; text-align: center; margin-bottom: 30px; }
        aside button { width: 100%; padding: 12px; background: transparent; color: white; border: none; text-align: left; cursor: pointer; border-radius: 4px; font-size: 1rem; margin-bottom: 5px; }
        aside button.active, aside button:hover { background: #2a2a2a; color: var(--primary); font-weight: bold; }
        
        main { flex: 1; padding: 40px; box-sizing: border-box; overflow-y: auto; height: 100vh; }
        .panel { display: none; }
        .panel.active { display: block; }
        
        .form-group { margin-bottom: 15px; max-width: 400px; }
        label { display: block; margin-bottom: 5px; color: #ccc; }
        input, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        button.btn-primary { padding: 10px 20px; background: var(--primary); color: black; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        /* Botón de eliminar en las tablas */
        .btn-danger { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-danger:hover { background: #ff3333; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--surface); border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #2a2a2a; color: var(--primary); }

        .card-link-reserva { background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 30px; max-width: 600px; }
        .card-link-reserva h3 { color: var(--primary); margin-top: 0; margin-bottom: 8px; font-size: 1.1rem; }
        .card-link-reserva p { color: #aaa; font-size: 0.85rem; margin: 0 0 15px 0; }
        .link-container { display: flex; gap: 10px; }
        .link-container input { flex: 1; font-family: monospace; background: #121212; border: 1px solid #444; color: #00ff66; }
        .link-container button { background: var(--primary); color: black; border: none; padding: 0 15px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .link-container button:hover { background: #fff; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <aside>
        <h2 id="txt-nombre-barberia">Mi Barbería</h2>
        <button id="btn-barberos" class="active" onclick="cambiarPestana('barberos')">💇‍♂️ Barberos / Equipo</button>
        <button id="btn-servicios" onclick="cambiarPestana('servicios')">⚙️ Servicios</button>
        <button id="btn-logout" style="color: #ff4d4d; margin-top: 50px;" onclick="cerrarSesion()">Cerrar Sesión</button>
    </aside>

    <main>
        <div class="card-link-reserva">
            <h3>🔗 Tu Link de Reservas para Clientes</h3>
            <p>Comparte este enlace en el perfil de tu Instagram, WhatsApp o Facebook para recibir citas de inmediato.</p>
            <div class="link-container">
                <input type="text" id="input-link-reserva" readonly value="Generando enlace de reservas...">
                <button onclick="copiarLinkReserva()">Copiar Link</button>
            </div>
        </div>

        <section id="panel-barberos" class="panel active">
            <h2>Gestionar mi Equipo</h2>
            <div class="form-group">
                <label>Nombre del Barbero</label>
                <input type="text" id="barbero-nombre" placeholder="Ej: Carlos Gómez">
            </div>
            <button class="btn-primary" onclick="agregarBarbero()">Agregar Barbero</button>

            <table>
                <thead>
                    <tr><th>Nombre</th><th>Rol</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tabla-barberos"></tbody>
            </table>
        </section>

        <section id="panel-servicios" class="panel">
            <h2>Gestionar mis Servicios</h2>
            <div class="form-group">
                <label>Nombre del Servicio</label>
                <input type="text" id="servicio-nombre" placeholder="Ej: Corte Degradado">
            </div>
            <div class="form-group">
                <label>Duración (minutos)</label>
                <input type="number" id="servicio-duracion" value="30">
            </div>
            <button class="btn-primary" onclick="agregarServicio()">Agregar Servicio</button>

            <table>
                <thead>
                    <tr><th>Servicio</th><th>Duración</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tabla-servicios"></tbody>
            </table>
        </section>
    </main>

<script>
    const SUPABASE_URL = "https://mtzntjajnnhudqaykadx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10em50amFqbm5odWRxYXlrYWR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxODE4MTgsImV4cCI6MjA5ODc1NzgxOH0.-QTcsA_BaE9fW1QB7o_1cID03MMvbsmpKCww6htT6bA";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let miBarberiaId = null;

    window.onload = async () => {
        // 1. Verificar si hay usuario autenticado
        const { data: { user } } = await _supabase.auth.getUser();
        
        if (!user) {
            alert("No has iniciado sesión.");
            window.location.href = "registro.html"; 
            return;
        }

        try {
            // 2. Traer la barbería vinculada a este usuario (dueño)
            const { data: barberia, error: errorBarberia } = await _supabase
                .from('barberias')
                .select('*')
                .eq('owner_id', user_id // O 'user_id', asegúrate de que coincida con tu columna en Supabase
                .single();

            if (errorBarberia || !barberia) {
                console.error("Error al cargar barbería:", errorBarberia);
                alert("No se encontró ninguna barbería vinculada a tu cuenta.");
                return;
            }

            // 3. Guardar el ID y pintar los datos en pantalla
            miBarberiaId = barberia.id;
            document.getElementById('txt-nombre-barberia').innerText = barberia.nombre;

            // 4. CORRECCIÓN DE URL: Detecta si estás en Localhost o en GitHub Pages
            let urlReservaCompleta = "";
            if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
                urlReservaCompleta = `${window.location.origin}/reservas.html?b=${barberia.slug}`;
            } else {
                const pathSegments = window.location.pathname.split('/');
                const repoName = pathSegments[1]; // Nombre de tu repositorio en GitHub Pages
                urlReservaCompleta = `${window.location.origin}/${repoName}/reservas.html?b=${barberia.slug}`;
            }
            
            // Colocar el enlace final en el input
            document.getElementById('input-link-reserva').value = urlReservaCompleta;

            // 5. Cargar las tablas secundarias ahora que tenemos el miBarberiaId
            cargarBarberos();
            cargarServicios();

        } catch (err) {
            console.error("Error crítico en el panel:", err);
        
    }; // <-- Ahora sí se cierra la función correctamente al final del proceso de carga

    function copiarLinkReserva() {
        const inputLink = document.getElementById('input-link-reserva');
        inputLink.select();
        inputLink.setSelectionRange(0, 99999); 

        navigator.clipboard.writeText(inputLink.value)
            .then(() => alert("¡Link de reserva copiado al portapapeles!"))
            .catch(() => alert("Error al copiar, selecciónalo manualmente."));
    }

    function cambiarPestana(pestana) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('aside button').forEach(b => b.classList.remove('active'));
        document.getElementById(`panel-${pestana}`).classList.add('active');
        document.getElementById(`btn-${pestana}`).classList.add('active');
    }

    async function agregarBarbero() {
        const nombre = document.getElementById('barbero-nombre').value.trim();
        if(!nombre) return alert("Escribe el nombre");

        const { error } = await _supabase.from('proveedores').insert([
            { nombre: nombre, barberia_id: miBarberiaId }
        ]);

        if (error) return alert(error.message);
        document.getElementById('barbero-nombre').value = "";
        cargarBarberos();
    }

    async function cargarBarberos() {
        const { data, error } = await _supabase
            .from('proveedores')
            .select('*')
            .eq('barberia_id', miBarberiaId);

        const tbody = document.getElementById('tabla-barberos');
        tbody.innerHTML = ""; 
        if (data) {
            tbody.innerHTML = data.map(b => `
                <tr>
                    <td>${b.nombre}</td>
                    <td>${b.rol || 'Especialista'}</td>
                    <td><button class="btn-danger" onclick="eliminarBarbero(${b.id})">Eliminar</button></td>
                </tr>
            `).join('');
        }
    }

    async function eliminarBarbero(id) {
        if(!confirm("¿Estás segura de que quieres eliminar este barbero?")) return;
        const { error } = await _supabase.from('proveedores').delete().eq('id', id);
        if (error) return alert(error.message);
        cargarBarberos();
    }

    async function agregarServicio() {
        const nombre = document.getElementById('servicio-nombre').value.trim();
        const duracion = document.getElementById('servicio-duracion').value;
        if(!nombre) return alert("Escribe el nombre del servicio");

        const { error } = await _supabase.from('servicios').insert([
            { nombre: nombre, duracion: parseInt(duracion), barberia_id: miBarberiaId }
        ]);

        if (error) return alert(error.message);
        document.getElementById('servicio-nombre').value = "";
        cargarServicios();
    }

    async function cargarServicios() {
        const { data } = await _supabase
            .from('servicios')
            .select('*')
            .eq('barberia_id', miBarberiaId);

        const tbody = document.getElementById('tabla-servicios');
        tbody.innerHTML = ""; 
        if (data) {
            tbody.innerHTML = data.map(s => `
                <tr>
                    <td>${s.nombre}</td>
                    <td>${s.duracion} min</td>
                    <td><button class="btn-danger" onclick="eliminarServicio(${s.id})">Eliminar</button></td>
                </tr>
            `).join('');
        }
    }

    async function eliminarServicio(id) {
        if(!confirm("¿Estás segura de eliminar este servicio?")) return;
        const { error } = await _supabase.from('servicios').delete().eq('id', id);
        if (error) return alert(error.message);
        cargarServicios();
    }

    async function cerrarSesion() {
        await _supabase.auth.signOut();
        window.location.href = "registro.html";
    }
</script>
</body>
</html>
